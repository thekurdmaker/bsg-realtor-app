# Builds the Android app in the cloud. Run it from: Actions -> "Build Android app" -> Run workflow.
# Needs (Settings -> Secrets and variables -> Actions):
#   Variable  APP_URL                    the web address of the realtor app, e.g. https://bsglink.online
#   Secrets   ANDROID_KEYSTORE_BASE64    the .jks file from FlutterFlow, as base64 text
#             ANDROID_KEYSTORE_PASSWORD  from credentials.txt
#             ANDROID_KEY_ALIAS          from credentials.txt
#             ANDROID_KEY_PASSWORD       from credentials.txt
name: Build Android app

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code (must be HIGHER than the last one on Google Play — FlutterFlow used 16)"
        required: true
        default: "17"
      version_name:
        description: "Version name shown in the Play Store"
        required: true
        default: "1.1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm ci

      - name: Check settings
        env:
          APP_URL: ${{ vars.APP_URL }}
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$APP_URL" ]; then echo "::error::Add the repository variable APP_URL (Settings -> Secrets and variables -> Actions -> Variables)"; exit 1; fi
          if [ -z "$KS" ]; then echo "::error::Add the secret ANDROID_KEYSTORE_BASE64"; exit 1; fi
          case "$APP_URL" in https://*) ;; *) echo "::error::APP_URL must start with https://"; exit 1;; esac

      - name: Put the app address in the config
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          sed -i "s#__APP_URL__#${APP_URL}#g" capacitor.config.json www/offline.html
          grep -n '"url"' capacitor.config.json

      - name: Copy web files into the Android project
        run: npx cap sync android

      - name: Unpack the upload key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Show the key fingerprint (must match Play Console -> App integrity -> Upload key certificate)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep -E "SHA1:|SHA256:"

      - name: Build (AAB for Google Play + APK for quick testing)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: bsg-android-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
