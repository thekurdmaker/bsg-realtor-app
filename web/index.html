<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B7A6E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1413" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="کۆڵ سەنتەر">
<meta name="format-detection" content="telephone=no">
<title>کۆڵ سەنتەر — باغی شەقڵاوە</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<script>
  try { var t = localStorage.getItem('bsgr_theme'); if (t === '"dark"' || t === '"light"') document.documentElement.setAttribute('data-bsgr-theme', JSON.parse(t)); } catch (e) {}
</script>
<style>
/* ======================================================================
   BSG realtor app. Everything lives under .bsgr so it can later sit
   inside another app without clashing. Class names start with r-.
   ====================================================================== */
.bsgr{
  --bg:#F3F6F5; --surface:#FFFFFF; --surface-2:#EDF2F1; --surface-3:#E3EAE8;
  --line:#DAE3E1; --line-2:#C7D3D0;
  --ink:#122220; --ink-2:#465855; --ink-3:#6E817E;
  --accent:#0B7A6E; --accent-strong:#075E55; --accent-soft:#DCF0EC; --accent-ink:#FFFFFF;
  --wa:#15803D; --wa-strong:#126B33; --wa-soft:#DCF2E4; --wa-ink:#FFFFFF;
  --warn:#9C5B05; --warn-soft:#FCEED6;
  --ok:#1B7A44; --ok-soft:#DCF2E4;
  --bad:#BA3727; --bad-soft:#FBE3DE;
  --ai:#6444BA; --ai-soft:#EDE7FA;
  --mute:#5B6B68; --mute-soft:#E7ECEB;
  --b-in:#FFFFFF; --b-in-line:#E1E8E6;
  --b-out:#E1F2EF; --b-out-line:#C4E2DC;
  --thread:#EEF3F1;
  --scrim:rgba(8,20,18,.45);
  --shadow:0 1px 2px rgba(18,34,32,.05),0 2px 12px rgba(18,34,32,.06);
  --shadow-lg:0 16px 44px rgba(10,24,22,.22),0 2px 8px rgba(10,24,22,.08);
  --font:"Noto Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;
  --font-display:"Noto Kufi Arabic","Noto Sans Arabic",Tahoma,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --top-h:60px; --tabs-h:64px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-bsgr-theme="light"]) .bsgr{
    --bg:#0C1413; --surface:#131D1C; --surface-2:#1A2725; --surface-3:#22312F;
    --line:#26363A; --line-2:#33474A;
    --ink:#E3EEEC; --ink-2:#A8BAB6; --ink-3:#7E918D;
    --accent:#34BFAE; --accent-strong:#62D6C7; --accent-soft:#123833; --accent-ink:#04201C;
    --wa:#22A652; --wa-strong:#3BC46B; --wa-soft:#0F2F1D; --wa-ink:#FFFFFF;
    --warn:#E9A94C; --warn-soft:#382810;
    --ok:#52C585; --ok-soft:#0F2F1D;
    --bad:#F07D6B; --bad-soft:#3A1813;
    --ai:#AB90F2; --ai-soft:#251C40;
    --mute:#9AABA7; --mute-soft:#202D2B;
    --b-in:#1A2725; --b-in-line:#26363A;
    --b-out:#123632; --b-out-line:#1B4842;
    --thread:#0F1817;
    --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 12px rgba(0,0,0,.25);
    --shadow-lg:0 16px 44px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-bsgr-theme="dark"] .bsgr{
  --bg:#0C1413; --surface:#131D1C; --surface-2:#1A2725; --surface-3:#22312F;
  --line:#26363A; --line-2:#33474A;
  --ink:#E3EEEC; --ink-2:#A8BAB6; --ink-3:#7E918D;
  --accent:#34BFAE; --accent-strong:#62D6C7; --accent-soft:#123833; --accent-ink:#04201C;
  --wa:#22A652; --wa-strong:#3BC46B; --wa-soft:#0F2F1D; --wa-ink:#FFFFFF;
  --warn:#E9A94C; --warn-soft:#382810;
  --ok:#52C585; --ok-soft:#0F2F1D;
  --bad:#F07D6B; --bad-soft:#3A1813;
  --ai:#AB90F2; --ai-soft:#251C40;
  --mute:#9AABA7; --mute-soft:#202D2B;
  --b-in:#1A2725; --b-in-line:#26363A;
  --b-out:#123632; --b-out-line:#1B4842;
  --thread:#0F1817;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 12px rgba(0,0,0,.25);
  --shadow-lg:0 16px 44px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.3);
  color-scheme:dark;
}

/* ---- host page (only when the app is on its own page) ---- */
html,body{margin:0;min-height:100%}
body{background:#F3F6F5;overscroll-behavior-y:contain}
@media (prefers-color-scheme: dark){ :root:not([data-bsgr-theme="light"]) body{background:#0C1413} }
:root[data-bsgr-theme="dark"] body{background:#0C1413}
:root[data-bsgr-theme="light"] body{background:#F3F6F5}

/* ---- base ---- */
.bsgr,.bsgr *,.bsgr *::before,.bsgr *::after{box-sizing:border-box}
.bsgr{background:var(--bg);color:var(--ink);font:15px/1.65 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
.bsgr button,.bsgr input,.bsgr textarea,.bsgr select{font:inherit;color:inherit}
.bsgr button{cursor:pointer}
.bsgr a{color:var(--accent-strong)}
.bsgr [hidden]{display:none !important}
.bsgr img{max-width:100%;display:block}
.bsgr :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bsgr .ic{flex:none;vertical-align:middle}
.bsgr .flip{transform:scaleX(-1)}
.bsgr .ltr{direction:ltr;unicode-bidi:isolate}
.bsgr .mono{font-family:var(--font-mono);direction:ltr;unicode-bidi:isolate;font-size:.92em;letter-spacing:.2px}
.bsgr .num{font-variant-numeric:tabular-nums}
.bsgr .muted{color:var(--ink-3)}
.bsgr .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- buttons ---- */
.r-btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;font-size:15px;cursor:pointer;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);text-align:center;line-height:1.3;transition:transform .08s,background .15s,opacity .15s;user-select:none;-webkit-user-select:none}
.r-btn:active{transform:scale(.98)}
.r-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.r-btn[disabled],.r-btn[aria-disabled="true"]{opacity:.5;cursor:default;transform:none}
.r-btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.r-btn.wa{background:var(--wa);color:var(--wa-ink);border-color:transparent}
.r-btn.wa:active{background:var(--wa-strong)}
.r-btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.r-btn.soft{background:var(--accent-soft);color:var(--accent-strong);border-color:transparent}
.r-btn.danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.r-btn.big{min-height:54px;font-size:16.5px;border-radius:14px;width:100%}
.r-btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.r-btn.icon{width:44px;padding:0}
.r-btn.busy{pointer-events:none;opacity:.75}
.r-btn.busy .ic{animation:r-spin .8s linear infinite}
@keyframes r-spin{to{transform:rotate(360deg)}}
.r-spin{width:18px;height:18px;border:2.5px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:r-spin .8s linear infinite;display:inline-block;vertical-align:middle}

/* ---- chips ---- */
.r-chip{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--mute-soft);color:var(--mute);white-space:nowrap;line-height:1}
.r-chip.warn{background:var(--warn-soft);color:var(--warn)}
.r-chip.ok{background:var(--ok-soft);color:var(--ok)}
.r-chip.bad{background:var(--bad-soft);color:var(--bad)}
.r-chip.accent{background:var(--accent-soft);color:var(--accent-strong)}
.r-chip.ai{background:var(--ai-soft);color:var(--ai)}
.r-chip.code{font-family:var(--font-mono);direction:ltr;unicode-bidi:isolate;letter-spacing:.3px}
.r-soon{display:inline-flex;align-items:center;min-height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:700;background:var(--ai-soft);color:var(--ai);white-space:nowrap;line-height:1}

/* ---- inputs ---- */
.r-field{display:flex;flex-direction:column;gap:6px}
.r-label{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.r-input,.r-textarea{width:100%;min-height:50px;border:1.5px solid var(--line-2);border-radius:12px;background:var(--surface);padding:0 14px;font-size:16px;transition:border-color .12s,box-shadow .12s}
.r-textarea{min-height:140px;padding:12px 14px;line-height:1.75;resize:vertical}
.r-input:focus,.r-textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.r-input.ltr{direction:ltr;text-align:right}
.r-pass{position:relative}
.r-pass .r-input{padding-inline-start:52px}
.r-pass button{position:absolute;inset-inline-start:4px;top:50%;transform:translateY(-50%)}

/* ---- app shell ---- */
.r-app{min-height:100vh;min-height:100dvh;padding-bottom:calc(var(--tabs-h) + var(--safe-b) + 12px)}
.r-top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.r-top-in{max-width:620px;margin:0 auto;height:var(--top-h);display:flex;align-items:center;gap:10px;padding:0 14px}
.r-logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 12px/1 var(--font-mono);letter-spacing:.5px;flex:none}
.r-top-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.r-top-title b{font:700 16.5px/1.3 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-top-title small{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-count{min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--warn);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:13px}
.r-count.zero{background:var(--ok-soft);color:var(--ok)}
.r-main{max-width:620px;margin:0 auto;padding:12px 14px 20px}

/* ---- bottom tabs ---- */
.r-tabs{position:fixed;inset-inline:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-b);box-shadow:0 -4px 16px rgba(0,0,0,.04)}
.r-tabs-in{max-width:620px;margin:0 auto;height:var(--tabs-h);display:grid;grid-template-columns:repeat(4,1fr)}
.r-tab{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink-3);position:relative}
.r-tab .ic{width:24px;height:24px}
.r-tab[aria-current="page"]{color:var(--accent-strong)}
.r-tab[aria-current="page"]::before{content:"";position:absolute;top:0;width:36px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.r-tab .r-badge{position:absolute;top:6px;left:50%;right:auto;margin-left:4px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1;box-shadow:0 0 0 2px var(--surface)}
.r-tab:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:10px}

/* ---- banners ---- */
.r-banner{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:12px;font-size:13.5px;line-height:1.6;margin-bottom:12px;background:var(--warn-soft);color:var(--warn)}
.r-banner.bad{background:var(--bad-soft);color:var(--bad)}
.r-banner.info{background:var(--accent-soft);color:var(--accent-strong)}
.r-banner.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--ink)}
.r-banner.warn>svg{color:var(--warn)}
.r-set-row .t small.ok{color:var(--ok);font-weight:600}
.r-banner .ic{margin-top:2px}
.r-banner b{font-weight:700}
.r-banner .r-banner-x{margin-inline-start:auto;flex:none}

/* ---- pull to refresh ---- */
.r-ptr{height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;color:var(--ink-3);font-size:13px;transition:height .18s}
.r-ptr .r-ptr-in{display:flex;align-items:center;gap:8px;padding-bottom:8px}
.r-ptr.pulling{transition:none}

/* ---- new-lead pill ---- */
.r-pill{position:fixed;z-index:35;top:calc(var(--safe-t) + var(--top-h) + 10px);inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 28px);display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;box-shadow:var(--shadow-lg);border:0;cursor:pointer;animation:r-drop .25s ease-out}
@keyframes r-drop{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}

/* ---- search + segments ---- */
.r-search{position:relative;margin-bottom:10px}
.r-search .ic{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.r-search .r-input{padding-inline-start:44px;padding-inline-end:44px;background:var(--surface);min-height:48px;border-width:1px}
.r-search .r-clear{position:absolute;inset-inline-end:4px;top:50%;transform:translateY(-50%)}
.r-seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2);margin-bottom:10px}
.r-seg button{all:unset;box-sizing:border-box;cursor:pointer;min-height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14.5px;color:var(--ink-2)}
.r-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.r-seg button .n{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--surface-3);font-size:12px;display:inline-grid;place-items:center;line-height:1}
.r-seg button[aria-pressed="true"] .n.hot{background:var(--warn);color:#fff}
.r-seg button:focus-visible{outline:2px solid var(--accent)}
.r-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.r-listhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 10px;font-size:13.5px;color:var(--ink-3)}
.r-filters{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;margin-inline:-2px}
.r-filters::-webkit-scrollbar{display:none}
.r-filters button{all:unset;box-sizing:border-box;cursor:pointer;flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:13.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.r-filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.r-filters button .n{font-size:12px;opacity:.8}

/* ---- lead card ---- */
.r-list{display:flex;flex-direction:column;gap:12px}
.r-lead{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.r-lead::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--line-2)}
.r-lead.is-wait::before{background:var(--warn)}
.r-lead.is-late::before{background:var(--bad)}
.r-lead.is-done::before{background:var(--ok)}
.r-lead.is-new{animation:r-flash 1.6s ease-out}
@keyframes r-flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.r-lead-main{all:unset;box-sizing:border-box;display:block;width:100%;padding:14px 16px 10px 14px;padding-inline-start:18px;cursor:pointer}
.r-lead-main:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;border-radius:16px}
.r-lead-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.r-lead-name{font-weight:700;font-size:16.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-lead-post{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:13.5px;color:var(--ink-2);min-width:0}
.r-lead-post .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.r-lead-msg{margin:8px 0 0;font-size:14px;color:var(--ink);background:var(--surface-2);border-radius:10px;padding:8px 11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.6;word-break:break-word}
.r-lead-msg .ic{color:var(--ink-3);margin-inline-end:4px}
.r-lead-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--ink-3)}
.r-lead-acts{display:flex;gap:8px;padding:0 14px 14px;padding-inline-start:18px}
.r-lead-acts .r-btn{flex:1}
.r-deadline{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;font-weight:600;color:var(--bad)}

/* ---- empty / loading ---- */
.r-empty{text-align:center;padding:44px 18px;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:10px}
.r-empty .ic{color:var(--line-2)}
.r-empty b{color:var(--ink);font-size:16.5px;font-family:var(--font-display)}
.r-empty p{margin:0;max-width:330px;line-height:1.75;font-size:14px}
.r-skel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.r-skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:r-sh 1.2s linear infinite}
@keyframes r-sh{to{background-position:-200% 0}}
.r-more{display:flex;justify-content:center;padding:14px 0 4px}

/* ---- detail (full screen) ---- */
.r-detail{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;animation:r-slide .2s ease-out}
@keyframes r-slide{from{transform:translateX(-16px);opacity:.4}to{transform:none;opacity:1}}
.r-d-top{background:var(--surface);border-bottom:1px solid var(--line);padding-top:var(--safe-t);flex:none}
.r-d-top-in{max-width:620px;margin:0 auto;height:var(--top-h);display:flex;align-items:center;gap:8px;padding:0 8px}
.r-d-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.r-d-title b{text-align:right;font-size:16.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-d-title small{font-size:12.5px;color:var(--ink-3)}
.r-d-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.r-d-body-in{max-width:620px;margin:0 auto;padding:12px 14px 20px;display:flex;flex-direction:column;gap:12px}
.r-d-foot{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + var(--safe-b))}
.r-d-foot-in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.r-d-foot .r-row .r-btn{flex:1}
.r-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.r-postbox{display:flex;gap:12px;align-items:flex-start}
.r-postbox .r-thumb{width:64px;height:64px;border-radius:12px;flex:none;object-fit:cover;background:var(--surface-2)}
.r-postbox .r-pb-t{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.r-postbox b{font-size:14.5px;line-height:1.5}
.r-kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}
.r-kv dt{color:var(--ink-3)}

class ApiError extends Error {
  constructor(message, code, status) { super(message); this.code = code || ''; this.status = status || 0; }
}
function humanError(e) {
  const m = String((e && e.message) || e || '');
  const map = [
    [/invalid login credentials|invalid_credentials/i, 'ئیمەیڵ یان وشەی نهێنی هەڵەیە. دووبارە هەوڵ بدەرەوە.'],
    [/email not confirmed/i, 'ئەم هەژمارە هێشتا چالاک نەکراوە. پەیوەندی بە بەڕێوەبەرەوە بکە.'],
    [/^network$/i, 'ئینتەرنێت نییە. پەیوەندییەکەت بپشکنە و دووبارە هەوڵ بدەرەوە.'],
    [/session_expired|jwt expired|invalid jwt/i, 'کاتی چوونەژوورەوەت تەواو بوو. تکایە دووبارە بچۆ ژوورەوە.'],
    [/already answered/i, 'ئەم نامەیە پێشتر وەرگیراوە.'],
    [/not your lead/i, 'ئەم نامەیە ئێستا هی تۆ نییە — لەوانەیە گوازرابێتەوە.'],
    [/not your post/i, 'تەنها دەتوانیت پۆستی خۆت دەستکاری بکەیت.'],
    [/lead not found/i, 'ئەم نامەیە نەدۆزرایەوە.'],
    [/forbidden/i, 'ئەم کارە بۆ تۆ ڕێگەپێدراو نییە.'],
    [/rate limit|too many/i, 'زۆر هەوڵت دا. کەمێک چاوەڕێ بکە و دووبارە هەوڵ بدەرەوە.'],
  ];
  for (const [re, txt] of map) if (re.test(m)) return txt;
  return 'هەڵەیەک ڕوویدا. دووبارە هەوڵ بدەرەوە.';
}

/* ============================ auth ============================ */
const auth = {
  s: lsGet('session_v1', null),
  save(j) {
    this.s = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || (Math.floor(Date.now() / 1000) + (j.expires_in || 3600)), email: (j.user && j.user.email) || (this.s && this.s.email) || '' };
    lsSet('session_v1', this.s);
  },
  clear() { this.s = null; lsDel('session_v1'); },
  async signIn(email, password) {
    let r;
    try {
      r = await fetch(CFG.url + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: CFG.anon, 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    } catch (e) { throw new ApiError('network', 'network', 0); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new ApiError(j.error_description || j.msg || j.message || j.error || 'login failed', j.error_code || j.error, r.status);
    this.save(j);
  },
  async refresh() {
    if (this._ref) return this._ref;
    const rt = this.s && this.s.refresh_token;
    if (!rt) throw new ApiError('session_expired', 'session', 401);
    this._ref = (async () => {
      let r;
      try {
        r = await fetch(CFG.url + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: CFG.anon, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: rt }) });
      } catch (e) { throw new ApiError('network', 'network', 0); }
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { this.clear(); throw new ApiError('session_expired', 'session', 401); }
      this.save(j);
    })();
    try { return await this._ref; } finally { this._ref = null; }
  },
  async token() {
    if (!this.s) throw new ApiError('session_expired', 'session', 401);
    if (Date.now() / 1000 > (this.s.expires_at || 0) - 90) await this.refresh();
    return this.s.access_token;
  },
  async signOut() {
    const tok = this.s && this.s.access_token;
    this.clear();
    if (tok) { try { await fetch(CFG.url + '/auth/v1/logout', { method: 'POST', headers: { apikey: CFG.anon, Authorization: 'Bearer ' + tok } }); } catch (e) { /* ignore */ } }
  },
};

async function api(path, opts, retried) {
  const o = opts || {};
  const tok = await auth.token();
  const h = { apikey: CFG.anon, Authorization: 'Bearer ' + tok };
  let payload;
  if (o.body !== undefined) { h['Content-Type'] = 'application/json'; payload = JSON.stringify(o.body); }
  let r;
  try { r = await fetch(CFG.url + path, { method: o.method || 'GET', headers: h, body: payload }); }
  catch (e) { throw new ApiError('network', 'network', 0); }
  if (r.status === 401 && !retried) { await auth.refresh(); return api(path, o, true); }
  const text = await r.text();
  let data = null;
  if (text) { try { data = JSON.parse(text); } catch (e) { data = text; } }
  if (!r.ok) {
    const msg = (data && typeof data === 'object' && (data.message || data.error_description || data.error || data.msg)) || ('HTTP ' + r.status);
    throw new ApiError(msg, data && data.code, r.status);
  }
  return data;
}
const rpc = (fn, args) => api('/rest/v1/rpc/' + fn, { method: 'POST', body: args || {} });
const get = (pathQuery) => api('/rest/v1/' + pathQuery);
const pgQuote = (s) => '"' + String(s).replace(/["\\]/g, '') + '"';

/* ============================ ui helpers ============================ */
function toast(msg, type, ms) {
  let box = $('.r-toasts');
  if (!box) { box = document.createElement('div'); box.className = 'r-toasts'; box.setAttribute('role', 'status'); box.setAttribute('aria-live', 'polite'); ROOT.appendChild(box); }
  const el = document.createElement('div');
  el.className = 'r-toast' + (type === 'err' ? ' err' : '');
  el.innerHTML = ic(type === 'err' ? 'alert' : 'checkCircle', 18) + `<span>${esc(msg)}</span>`;
  box.appendChild(el);
  setTimeout(() => el.remove(), ms || (type === 'err' ? 5500 : 2600));
}
function toastErr(e) {
  if (e && e.code === 'session') { auth.clear(); App.showLogin(humanError(e)); return; }
  if (e && e.code === 'network') App.setOnline(false);
  toast(humanError(e), 'err');
}
function busy(btn, on) {
  if (!btn) return;
  btn.classList.toggle('busy', !!on);
  btn.disabled = !!on;
  if (on) btn.setAttribute('aria-busy', 'true'); else btn.removeAttribute('aria-busy');
}

// bottom sheet: {title, html, actions:[{label, cls, onClick(sheet) -> false keeps open}], onOpen}
const sheets = [];
function sheet(o) {
  const el = document.createElement('div');
  el.className = 'r-sheet';
  el.innerHTML = `<div class="r-sheet-scrim"></div>
    <div class="r-sheet-card" role="dialog" aria-modal="true" aria-label="${esc(o.title || '')}">
      <div class="r-grab" aria-hidden="true"></div>
      ${o.title ? `<h2>${esc(o.title)}</h2>` : ''}
      <div class="r-sheet-body">${o.html || ''}</div>
      <div class="r-err" hidden></div>
      <div class="r-sheet-acts">${(o.actions || []).map((a, i) => a.href
        ? `<a class="r-btn big ${a.cls || ''}" data-i="${i}" href="${esc(a.href)}" target="_blank" rel="noopener">${a.icon ? ic(a.icon, 20) : ''}${esc(a.label)}</a>`
        : `<button type="button" class="r-btn big ${a.cls || ''}" data-i="${i}">${a.icon ? ic(a.icon, 20) : ''}${esc(a.label)}</button>`).join('')}
        <button type="button" class="r-btn big ghost" data-close>${esc(o.cancel || 'داخستن')}</button>
      </div>
    </div>`;
  ROOT.appendChild(el);
  const prev = document.activeElement;
  const inst = {
    el,
    close() { const i = sheets.indexOf(inst); if (i >= 0) sheets.splice(i, 1); el.remove(); if (o.onClose) o.onClose(); try { if (prev && prev.focus) prev.focus(); } catch (e) { /* ignore */ } },
    error(msg) { const e = $('.r-err', el); e.textContent = msg || ''; e.hidden = !msg; },
  };
  sheets.push(inst);
  $('.r-sheet-scrim', el).addEventListener('click', () => inst.close());
  $('[data-close]', el).addEventListener('click', () => inst.close());
  $$('[data-i]', el).forEach((b) => b.addEventListener('click', async (ev) => {
    const a = o.actions[+b.dataset.i];
    if (!a.onClick) { if (a.href) setTimeout(() => inst.close(), 300); return; }
    if (a.href) { a.onClick(inst, ev); setTimeout(() => inst.close(), 300); return; }
    inst.error('');
    busy(b, true);
    try { const r = await a.onClick(inst, ev); if (r !== false) inst.close(); }
    catch (e) { inst.error(humanError(e)); if (e && e.code === 'session') { inst.close(); toastErr(e); } }
    finally { if (el.isConnected) busy(b, false); }
  }));
  if (o.onOpen) o.onOpen(inst);
  setTimeout(() => { const f = $('[autofocus]', el) || $('.r-sheet-acts .r-btn', el); if (f) f.focus(); }, 30);
  return inst;
}
function closeTopSheet() { const s = sheets[sheets.length - 1]; if (s) { s.close(); return true; } return false; }

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    try {
      const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e2) { return false; }
  }
}

/* ============================ lightbox ============================ */
function lightbox(urls, start) {
  let i = start || 0;
  const el = document.createElement('div');
  el.className = 'r-lb';
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-label', 'وێنە');
  const paint = () => {
    el.innerHTML = `<img src="${esc(urls[i])}" alt="">
      <button type="button" class="r-btn icon r-lb-x" aria-label="داخستن">${ic('x', 22)}</button>
      ${urls.length > 1 ? `<button type="button" class="r-btn icon r-lb-nav r-lb-prev" aria-label="پێشوو">${ic('chevR', 24)}</button>
      <button type="button" class="r-btn icon r-lb-nav r-lb-next" aria-label="دواتر">${ic('chevL', 24)}</button>
      <div class="r-lb-n">${fmtN(i + 1)} / ${fmtN(urls.length)}</div>` : ''}`;
  };
  paint();
  el.addEventListener('click', (e) => {
    if (e.target.closest('.r-lb-prev')) { i = (i - 1 + urls.length) % urls.length; paint(); return; }
    if (e.target.closest('.r-lb-next')) { i = (i + 1) % urls.length; paint(); return; }
    el.remove();
  });
  let sx = null;
  el.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
  el.addEventListener('touchend', (e) => {
    if (sx == null || urls.length < 2) return;
    const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) < 50) return;
    i = dx > 0 ? (i + 1) % urls.length : (i - 1 + urls.length) % urls.length; // RTL: swipe right = next
    paint();
  });
  ROOT.appendChild(el);
}

function saveCache() {

  lsSet('cache_v1', {

function loadCache() {
  const c = lsGet('cache_v1', null);

  S.ansOffset = S.answered.length; S.lastSync = c.at || null;
  index(S.pending); index(S.answered);

/* ============================ loading ============================ */
async function loadPending(fromPoll) {
  const rows = await rpc('get_my_thread_leads', { p_status: 'pending', p_limit: CFG.pendingMax, p_offset: 0 });
  const list = (rows || []).map(normLead);
  if (S.knownPending && fromPoll) {
    const fresh = list.filter((l) => !S.knownPending.has(l.id));
    if (fresh.length) {
      S.newCount += fresh.length; fresh.forEach((l) => S.flash.add(l.id));
      setTimeout(() => { fresh.forEach((l) => S.flash.delete(l.id)); }, 6000);
    }
  }
  S.knownPending = new Set(list.map((l) => l.id));
  S.pending = list; index(list);
}
async function loadAnswered(reset) {
  if (S.ansLoading) return;
  S.ansLoading = true;
  try {
    const offset = reset ? 0 : S.ansOffset;
    const rows = await rpc('get_my_thread_leads', { p_status: 'answered', p_limit: CFG.answeredPage, p_offset: offset });
    const list = (rows || []).map(normLead);
    index(list);
    if (reset) S.answered = list;
    else { const have = new Set(S.answered.map((l) => l.id)); S.answered = S.answered.concat(list.filter((l) => !have.has(l.id))); }

async function loadAll(fromPoll) {

/* ============================ time rules ============================ */
function waitMins(l) { const d = toDate(l.assignedAt); return d ? (Date.now() - d.getTime()) / 60000 : null; }
function deadlineMins(l) { const d = toDate(l.deadline); return d ? (d.getTime() - Date.now()) / 60000 : null; }
function leadTone(l) {
  if (l.status === 'answered') return 'is-done';
  const w = waitMins(l), dl = deadlineMins(l);
  if ((dl != null && dl < 60) || (w != null && w > 300)) return 'is-late';
  return 'is-wait';
}
function lastCustomerLine(l) {
  const list = l.msgs || [];
  for (let i = list.length - 1; i >= 0; i--) {
    const m = list[i];
    if (m.dir !== 'in') continue;
    if (m.kind === 'gallery') return { icon: 'image', text: fmtN((m.images || []).length) + ' وێنە' };
    if (m.type && MEDIA_LABEL[m.type]) return { icon: MEDIA_ICON[m.type], text: m.cap || m.text || MEDIA_LABEL[m.type] };
    if (m.text) return { icon: null, text: m.text };
  }
  return l.firstMsg ? { icon: null, text: l.firstMsg } : null;
}

/* ============================ inbox ============================ */
function segList() {
  if (S.seg === 'answered') return S.answered;
  if (S.seg === 'all') {
    const all = S.pending.concat(S.answered.filter((a) => !S.pending.some((p) => p.id === a.id)));
    return all.slice().sort((a, b) => String(b.lastAt || '').localeCompare(String(a.lastAt || '')));
  }
  const list = S.pending.slice();
  list.sort((a, b) => {
    const x = String(a.assignedAt || ''), y = String(b.assignedAt || '');
    return S.sortOldest ? x.localeCompare(y) : y.localeCompare(x);
  });
  return list;
}
function matches(l, nq, dq) {
  if (!nq) return true;
  const hay = normTxt([l.name, l.headline, l.firstMsg, postCode(l), l.groupName].join(' '));
  if (hay.includes(nq)) return true;
  if (dq.length >= 3 && l.status === 'answered' && l.number && digits(l.number).includes(dq)) return true;
  if (dq.length >= 1 && postCode(l) && digits(postCode(l)) === dq) return true;
  return false;
}

const SAFE_COLS = 'id,status,customer_name_resolved,customer_display_name,customer_whatsapp_name,customer_message,facebook_post_id,post_headline,created_at,assigned_at,answer_deadline_at,first_response_at,message_count,last_message_at,last_inbound_at,forward_count,group_name,group_kind';
const remoteSearch = debounce(async () => {
  const q = S.q.trim();
  if (q.length < 2 || !S.me) { S.remote = []; S.searching = false; App.render(); return; }
  S.searching = true; App.render();
  try {
    const clean = q.replace(/["\\(),*%]/g, ' ').trim();
    const ors = [`customer_name_resolved.ilike."*${clean}*"`, `post_headline.ilike."*${clean}*"`, `customer_message.ilike."*${clean}*"`];
    const d = digits(q).replace(/^0+/, '');
    const codeHits = S.posts.filter((p) => p.code && digits(p.code) === digits(q)).map((p) => p.id);
    if (codeHits.length) ors.push(`facebook_post_id.in.(${codeHits.map(pgQuote).join(',')})`);
    const base = `v_my_leads?realtor_id=eq.${S.me.realtor_id}&status=in.(pending,answered)&order=created_at.desc&limit=30`;
    const jobs = [get(`${base}&select=${SAFE_COLS}&or=${encodeURIComponent('(' + ors.join(',') + ')')}`)];
    // a number is only searchable on answered leads (it stays hidden until the lead is taken)
    if (d.length >= 4) jobs.push(get(`${base.replace('status=in.(pending,answered)', 'status=eq.answered')}&select=${SAFE_COLS},customer_number&customer_number_clean=ilike.${encodeURIComponent('*' + d + '*')}`));
    const res = await Promise.all(jobs);
    if (S.q.trim() !== q) return;
    const seen = new Set();
    S.remote = [].concat(...res.map((r) => r || [])).filter((r) => (seen.has(r.id) ? false : seen.add(r.id))).map((r) => {
      const known = S.byId.get(r.id);
      if (known) return known;
      const l = normLead(r); l.partial = true; S.byId.set(l.id, l); return l;
    });
  } catch (e) { if (e && e.code === 'session') toastErr(e); S.remote = []; }
  S.searching = false;
  if (S.q.trim() === q) App.render();
}, 380);

async function fillLead(l) {
  if (!l.partial) return l;
  const jobs = [get(`v_lead_thread?select=id,message_text,direction,sent_by,media_url,media_type,media_caption,created_at,is_from_manager&lead_id=eq.${l.id}&order=created_at.asc,id.asc&limit=300`)];
  if (l.status === 'answered' && !l.number) jobs.push(get(`v_my_leads?select=customer_number,first_response_at&id=eq.${l.id}&status=eq.answered`));
  const [msgs, num] = await Promise.all(jobs);
  l.msgs = groupImages((msgs || []).map((m) => normMsg(m)));
  if (num && num[0]) { l.number = num[0].customer_number || null; l.answeredAt = l.answeredAt || num[0].first_response_at; }
  const p = postOf(l);
  if (p) { l.prefill = l.prefill || p.reply || ''; l.postUrl = l.postUrl || p.url || ''; }
  l.partial = false;
  return l;
}
// same grouping the database does: images in a row from the same side become one gallery
function groupImages(list) {
  const out = [];
  list.forEach((m) => {
    const isImg = m.type === 'image' && m.url;
    const prev = out[out.length - 1];
    if (isImg && prev && prev.dir === m.dir && (prev.kind === 'gallery' || (prev.type === 'image' && prev.url && !prev.text))) {
      if (prev.kind !== 'gallery') { prev.kind = 'gallery'; prev.images = [prev.url]; }
      prev.images.push(m.url);
      return;
    }
    out.push(Object.assign({}, m));
  });
  return out;
}

async function answerLead(id, btn) {
  const l = S.byId.get(id); if (!l) return;

    if (l.number && isPhoneNum(l.number)) { openOutside(waUrl(l.number, l.prefill)); markOpened(id); }
    return;
  }
  const withText = S.sendDetails && l.prefill ? l.prefill : '';
  // Open the new window right now, while the tap still counts, so the browser does not block it.
  // On an iPhone home-screen app this is unreliable, so there we show a big button instead.
  const iosApp = window.navigator.standalone === true;
  const native = isNativeApp();   // Android app: WhatsApp is opened directly after the answer is saved
  let win = null;
  if (!iosApp && !native) { try { win = window.open('', '_blank'); } catch (e) { win = null; } }
  busy(btn, true);
  try {
    const row = await rpc('realtor_answer_lead', { p_lead_id: id });
    const r = Array.isArray(row) ? row[0] : row;

      if (win) try { win.close(); } catch (e) { /* ignore */ }

      sheet({ title: 'ژمارەی کڕیار شاراوەیە', html: `<p>نامەکە بوو بە هی تۆ، بەڵام ئەم کڕیارە ژمارەکەی لە واتسئاپ شاردۆتەوە، بۆیە ناتوانرێت ڕاستەوخۆ نامەی بۆ بنێریت.</p><p>تکایە پەیوەندی بە بەڕێوەبەرەوە بکە تاکو لە ڕێگەی کۆڵ سەنتەرەوە وەڵامی بداتەوە.</p>` });
      return;
    }
    const url = waUrl(l.number, withText);
    markOpened(id);
    if (win && !win.closed) {
      try { win.opener = null; win.location.href = url; } catch (e) { win = null; }
    }
    App.render(); if (S.detailId === id) paintDetail();
    saveCache();
    if (native) { openOutside(url); toast('نامەکە بوو بە هی تۆ'); }
    else if (!win) {
      sheet({ title: 'نامەکە بوو بە هی تۆ ✓', html: `<p>ژمارەی کڕیار: <b class="mono">${esc(niceNum(l.number))}</b></p><p>ئێستا واتسئاپ بکەرەوە و وەڵامی بدەرەوە.</p>`,
        actions: [{ label: 'کردنەوەی واتسئاپ', cls: 'wa', icon: 'chat', href: url }, { label: 'پەیوەندی', icon: 'phone', href: telUrl(l.number) }] });
    } else toast('نامەکە بوو بە هی تۆ');
  } catch (e) {

}

const BOOST = {
  running: { label: 'ڕیکلامی چالاک', cls: 'ok', icon: 'rocket' },
  ended: { label: 'ڕیکلامی تەواوبوو', cls: '', icon: 'clock' },
  none: { label: 'بێ ڕیکلام', cls: 'warn', icon: 'megaphone' },

function boostState(x) {
  const spent = Number(x.spend) > 0;
  if (!x.start && !spent) return 'none';
  if (x.active === false) return 'ended';
  if (x.expired && Date.now() >= new Date(x.expired).getTime()) return 'ended';
  if (!x.start) return x.status === 'ended' ? 'ended' : 'running';
  return Date.now() <= boostEnd(x) ? 'running' : 'ended';
}
const boostEnd = (x) => (x.fbEnd ? new Date(x.fbEnd).getTime() : x.start ? new Date(x.start).getTime() + (Number(x.days) || 0) * 864e5 : null);

function capHeadline(c) {
  const lines = String(c || '').replace(/\r/g, '').split('\n').map((l) => l.replace(/\s+/g, ' ').trim()).filter((l) => /\p{L}/u.test(l) && !CODE_RX.test(l) && !/^[*\-_=🔶\s]+$/u.test(l));
  return lines[0] || '';
}

async function loadPosts() {
  const [rows, fbRows] = await Promise.all([
    rpc('realtor_get_my_posts').then((r) => r || []),
    rpc('realtor_get_fb_posts').then((r) => r || []).catch(() => null),   // Facebook page posts with my phone number
  ]);
  const ids = rows.map((r) => r.facebook_post_id).filter(Boolean);
  let extra = [];
  if (ids.length) {
    const inList = encodeURIComponent('(' + ids.map(pgQuote).join(',') + ')');
    extra = (await get(`posts?select=facebook_post_id,realtor_id,group_id,image_url,sponsor_start_at,sponsor_days,sponsor_spend_usd,active,expired_at,created_at&facebook_post_id=in.${inList}`)) || [];
  }
  const ex = new Map(extra.map((x) => [x.facebook_post_id, x]));
  const gName = new Map(S.groups.map((g) => [g.group_id, g.group_name]));
  const list = rows.map((r) => {
    const x = ex.get(r.facebook_post_id) || {};
    return {
      id: r.facebook_post_id, kind: 'sys', headline: r.headline || '', code: r.post_code || '', reply: r.reply_template || '',
      caption: r.caption || '', url: r.facebook_post_url || '',

      forwarded: Number(r.forwarded) || 0, escalated: Number(r.escalated) || 0, status: r.post_status || '',

      groupId: x.group_id || null, groupName: gName.get(x.group_id) || '',

  const byId = new Map(list.map((p) => [p.id, p]));

/* ============================ notifications (OneSignal) ============================
   Android app  -> native OneSignal through window.Capacitor.Plugins.BsgPush (real native push)
   iPhone PWA   -> OneSignal Web SDK, only on the address saved in OneSignal (bsglink.online)
   Both log in with app_users.id, the same id the server already sends every new lead to. */
const PUSH_APP_ID = '64d04a6a-e9b8-43b5-b0ab-f752e586bcb9';
const PUSH_WEB_ORIGINS = ['https://bsglink.online', 'https://www.bsglink.online'];
const isNativeApp = () => !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform());

    if (!this._p) this._p = typeof C.registerPlugin === 'function' ? C.registerPlugin('BsgPush') : (C.Plugins && C.Plugins.BsgPush) || null;
    return this._p;
  },
  webAllowed() { return PUSH_WEB_ORIGINS.includes(location.origin); },
  set(s) { if (this.state !== s) { this.state = s; lsSet('push_state', s); if (App.render && S.me) App.render(); } },

  async start() {
    if (!S.me || !S.me.app_user_id) return;
    const uid = String(S.me.app_user_id);
    try {
      if (isNativeApp()) {
        const p = this.plugin(); if (!p) { this.set('unsupported'); return; }
        if (!this.started) {
          this.started = true;
          p.addListener('click', () => { if (typeof loadAll === 'function') loadAll(false); location.hash = '#/inbox'; });
          document.addEventListener('visibilitychange', () => { if (!document.hidden) this.refresh(); });
        }
        await p.login({ externalId: uid });
        await this.refresh();
        // first run: ask right away (Android shows its own "Allow notifications?" box)
        if (this.state !== 'on' && !lsGet('push_asked', false)) { lsSet('push_asked', true); await this.enable(true); }

  loadWeb() {

  },

  },
  explainDenied() {

      title: 'ئاگادارکردنەوە داخراوە',
      html: native
        ? '<p>بۆ ئەوەی هەر نامەیەکی نوێ بێت ئاگادار بکرێیتەوە، لە ڕێکخستنەکانی مۆبایل ئاگادارکردنەوە بۆ ئەم ئەپە بکەرەوە.</p><p class="muted">ئەگەر مۆبایلەکەت Xiaomi، Oppo یان Huawei ـە: لە ڕێکخستنی باتری ئەم ئەپە «No restrictions» هەڵبژێرە.</p>'

      actions: native ? [{ label: 'کردنەوەی ڕێکخستنەکان', cls: 'primary', icon: 'bell', onClick: async () => { await this.plugin().openSettings(); } }] : [],

  },
  async test(btn) {

};

/* ============================ my numbers ============================ */
function periodStart(key) {
  if (key === 'month') return new Date(YMD.format(new Date()).slice(0, 8) + '01T00:00:00+03:00');
  return new Date(Date.now() - 7 * 864e5);
}
let statsInflight = null;
function loadStats(force) {
  const key = S.statsPeriod;
  if (!force && S.stats && S.statsKey === key && Date.now() - (S.stats.at || 0) < 60000) return Promise.resolve();
  if (statsInflight) return statsInflight;
  S.statsError = null;
  statsInflight = fetchStats(key).catch((e) => { S.statsError = e; throw e; }).finally(() => { statsInflight = null; });
  return statsInflight;
}
async function fetchStats(key) {
  const since = periodStart(key).toISOString();
  const rows = (await get(`leads?select=id,status,assigned_at,first_response_at&realtor_id=eq.${S.me.realtor_id}&assigned_at=gte.${encodeURIComponent(since)}&order=assigned_at.desc&limit=5000`)) || [];
  const answered = rows.filter((r) => r.status === 'answered');
  const resp = answered.map((r) => {
    const a = toDate(r.assigned_at), f = toDate(r.first_response_at);
    return a && f ? Math.max(0, (f - a) / 60000) : null;
  }).filter((x) => x != null).sort((a, b) => a - b);
  const median = resp.length ? (resp.length % 2 ? resp[(resp.length - 1) / 2] : (resp[resp.length / 2 - 1] + resp[resp.length / 2]) / 2) : null;
  S.stats = {
    at: Date.now(), received: rows.length, answered: answered.length,
    waiting: rows.filter((r) => r.status === 'pending').length,
    other: rows.filter((r) => r.status !== 'pending' && r.status !== 'answered').length,
    median, fast: resp.filter((m) => m <= 60).length, respN: resp.length,
  };
  S.statsKey = key;
}

  ['inbox', 'نامەکان', 'inbox'],
  ['posts', 'پۆستەکانم', 'megaphone'],
  ['stats', 'ئامارەکەم', 'chart'],
  ['me', 'هەژمار', 'user'],
];
const TITLES = { inbox: 'نامەکانم', posts: 'پۆستەکانم', stats: 'ئامارەکەم', me: 'هەژمارەکەم' };
let tab = 'inbox';

App.renderShell = function () {
  ROOT.innerHTML = `<div class="r-app">
    <header class="r-top"><div class="r-top-in">
      <div class="r-logo" aria-hidden="true">BSG</div>
      <div class="r-top-title"><b id="r-title"></b><small id="r-sub"></small></div>
      <span class="r-count" id="r-count" hidden></span>
      <button type="button" class="r-btn icon ghost" id="r-refresh" aria-label="نوێکردنەوە">${ic('refresh', 21)}</button>
    </div></header>
    <div class="r-ptr" id="r-ptr" aria-hidden="true"><div class="r-ptr-in">${ic('down', 16)} <span>بەرەو خوارەوە ڕایبکێشە بۆ نوێکردنەوە</span></div></div>
    <main class="r-main" id="r-main"></main>
    <nav class="r-tabs" aria-label="بەشەکان"><div class="r-tabs-in">${TABS.map(([k, l, i]) => `<button type="button" class="r-tab" data-tab="${k}">${ic(i, 24)}<span>${esc(l)}</span>${k === 'inbox' ? '<span class="r-badge" id="r-tabbadge" hidden></span>' : ''}</button>`).join('')}</div></nav>
    <button type="button" class="r-pill" id="r-pill" hidden></button>
  </div>`;
  $('#r-refresh').addEventListener('click', (e) => manualRefresh(e.currentTarget));
  $('.r-tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); });
  $('#r-pill').addEventListener('click', () => {
    S.newCount = 0; S.seg = 'pending'; S.q = ''; S.remote = [];
    go('inbox');
    requestAnimationFrame(() => {
      const card = $('.r-lead.is-new');
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' }); else window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
  $('#r-main').addEventListener('click', onMainClick);
  $('#r-main').addEventListener('input', onMainInput);
  setupPullToRefresh();
};
App.render = function () {
  const main = $('#r-main'); if (!main) return;
  const active = document.activeElement;
  const keepQ = active && active.id === 'r-q' ? [active.selectionStart, active.selectionEnd] : null;
  $('#r-title').textContent = TITLES[tab];
  $('#r-sub').textContent = tab === 'inbox' && S.me ? 'سڵاو ' + (S.me.name || '').split(' ')[0] + ' 👋' : (S.me && S.me.branch ? 'لقی ' + S.me.branch : '');
  $$('.r-tab').forEach((b) => { if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (tab === 'inbox') renderInbox(main);
  else if (tab === 'posts') renderPosts(main);
  else if (tab === 'stats') renderStats(main);
  else renderMe(main);
  if (keepQ) { const q = $('#r-q'); if (q) { q.focus(); try { q.setSelectionRange(keepQ[0], keepQ[1]); } catch (e) { /* ignore */ } } }
  const pill = $('#r-pill');
  if (pill) {
    const show = S.newCount > 0 && S.pillFor !== S.newCount + ':seen';
    pill.hidden = !show;
    if (show) {
      pill.innerHTML = `${ic('bell', 18)} ${fmtN(S.newCount)} نامەی نوێ هات — بیبینە`;
      if (S.pillFor !== String(S.newCount)) {
        S.pillFor = String(S.newCount);
        clearTimeout(S.pillTimer);
        S.pillTimer = setTimeout(() => { S.pillFor = S.newCount + ':seen'; const p = $('#r-pill'); if (p) p.hidden = true; }, 12000);
      }
    }
  }
};
App.updateBadge = function () {
  const n = S.pending.length;
  const c = $('#r-count'), tb = $('#r-tabbadge');
  if (c) { c.hidden = !S.loaded; c.textContent = fmtN(n); c.classList.toggle('zero', !n); c.title = n ? n + ' نامەی چاوەڕێ' : 'هیچ نامەیەک چاوەڕێ نییە'; }
  if (tb) { tb.hidden = !n; tb.textContent = n > 99 ? '99+' : String(n); }
  document.title = (n ? '(' + n + ') ' : '') + 'کۆڵ سەنتەر';
  try { if (navigator.setAppBadge) { if (n) navigator.setAppBadge(n); else navigator.clearAppBadge(); } } catch (e) { /* not supported */ }
};
App.setOnline = function (on) {
  if (S.online === on) return;
  S.online = on;
  App.render();
};
function go(t, fromHash) {
  if (!TITLES[t]) t = 'inbox';
  tab = t;
  if (!fromHash && location.hash !== '#/' + t) history.replaceState(null, '', '#/' + t);
  window.scrollTo(0, 0);
  if (t === 'me') ensureGroups().then(() => { if (tab === 'me') App.render(); });
  App.render();
}
function route() {
  const h = location.hash || '';
  const m = h.match(/^#\/lead\/([\w-]+)/);
  if (m) { if (S.detailId !== m[1]) openLead(m[1], false); return; }
  if (S.detailId) closeLead(true);
  const t = h.replace(/^#\//, '').split('/')[0];
  if (TITLES[t] && t !== tab) go(t, true); else if (!TITLES[t]) go(tab || 'inbox', false);
}
window.addEventListener('popstate', () => { closeTopSheet(); const lb = $('.r-lb'); if (lb) lb.remove(); route(); });

async function manualRefresh(btn) {
  busy(btn, true);
  S.newCount = 0;
  try {
    await loadAll(false);
    if (tab === 'stats') { S.statsError = null; await loadStats(true).catch(() => {}); App.render(); }
    if (S.online) toast('نوێ کرایەوە');
  } finally { busy(btn, false); }
}

/* ============================ clicks & typing ============================ */
function onMainClick(e) {
  const t = e.target;
  const seg = t.closest('[data-seg]');
  if (seg) { S.seg = seg.dataset.seg; lsSet('seg', S.seg); App.render(); if (S.seg !== 'pending' && !S.answered.length && !S.ansDone) loadAnswered(true).then(App.render).catch(toastErr); return; }
  if (t.closest('#r-sort')) { S.sortOldest = !S.sortOldest; lsSet('sort_oldest', S.sortOldest); App.render(); return; }
  if (t.closest('#r-q-x')) { S.q = ''; S.remote = []; App.render(); const q = $('#r-q'); if (q) q.focus(); return; }
  if (t.closest('#r-more')) { const b = t.closest('#r-more'); busy(b, true); loadAnswered(false).then(() => { saveCache(); App.render(); }).catch(toastErr); return; }
  const a = t.closest('[data-answer]'); if (a) { answerLead(a.dataset.answer, a); return; }
  const w = t.closest('[data-wa]'); if (w) { markOpened(w.dataset.wa); return; }
  if (t.closest('[data-call]')) return;
  const o = t.closest('[data-open]'); if (o) { openLead(o.dataset.open); return; }
  const per = t.closest('[data-per]'); if (per) { S.statsPeriod = per.dataset.per; lsSet('stats_period', S.statsPeriod); App.render(); return; }
  const th = t.closest('[data-theme]'); if (th) { lsSet('theme', th.dataset.theme); applyTheme(th.dataset.theme); App.render(); return; }
  const act = t.closest('[data-act]');
  if (act) {
    const k = act.dataset.act;
    if (k === 'reload') { manualRefresh($('#r-refresh')); return; }
    if (k === 'statsretry') { S.statsError = null; App.render(); return; }
    if (k === 'install' || k === 'doinstall') { installHelp(); return; }
    if (k === 'hideinstall') { lsSet('install_hide', true); App.render(); return; }
    if (k === 'hardreload') { location.reload(); return; }
    if (k === 'pushon') { Push.enable(false); return; }
    if (k === 'pushtest') { Push.test(act); return; }
    if (k === 'logout') {
      sheet({ title: 'دڵنیایت دەتەوێت بچیتە دەرەوە؟', html: '<p>بۆ گەڕانەوە پێویستت بە ئیمەیڵ و وشەی نهێنییەکەت دەبێت.</p>', actions: [{ label: 'بەڵێ، دەرچوون', cls: 'danger', icon: 'logout', onClick: async () => { await Push.logout(); await auth.signOut(); lsDel('cache_v1'); lsDel('me'); lsDel('groups'); location.hash = ''; App.showLogin(); } }], cancel: 'نەخێر' });
      return;
    }
  }
  if (tab === 'posts') onPostsClick(e);
}
function onMainInput(e) {
  if (e.target.id === 'r-q') {
    S.q = e.target.value;
    const x = $('#r-q-x'); if (x) x.hidden = !S.q;
    renderInboxSoon();
    remoteSearch();
  }
}
const renderInboxSoon = debounce(() => { if (tab === 'inbox') App.render(); }, 120);

/* ============================ pull to refresh ============================ */
function setupPullToRefresh() {
  const ptr = $('#r-ptr'); const txt = $('#r-ptr span');
  let y0 = null, dy = 0, pulling = false;
  window.addEventListener('touchstart', (e) => {
    if (S.detailId || sheets.length || window.scrollY > 0 || !e.target.closest('.r-main')) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0; pulling = false;
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 8 && window.scrollY <= 0) {
      pulling = true; ptr.classList.add('pulling');
      ptr.style.height = Math.min(70, dy * 0.45) + 'px';
      txt.textContent = dy * 0.45 > 52 ? 'بەرەڵای بکە بۆ نوێکردنەوە' : 'بەرەو خوارەوە ڕایبکێشە بۆ نوێکردنەوە';
    }
  }, { passive: true });
  window.addEventListener('touchend', async () => {
    if (y0 == null) return;
    const go2 = pulling && dy * 0.45 > 52;
    y0 = null; ptr.classList.remove('pulling');
    if (!go2) { ptr.style.height = '0px'; return; }
    ptr.style.height = '46px'; txt.textContent = 'نوێ دەکرێتەوە…';
    try { await manualRefresh($('#r-refresh')); } finally { ptr.style.height = '0px'; }
  });
}

/* ============================ polling ============================ */
let pollTimer = null;
function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (document.visibilityState === 'visible' && S.me) loadAll(true); }, CFG.pollMs);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.me && auth.s) loadAll(true); });
window.addEventListener('online', () => { if (S.me && auth.s) loadAll(true); });
window.addEventListener('offline', () => App.setOnline(false));
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if ($('.r-lb')) { $('.r-lb').remove(); return; }
  if (closeTopSheet()) return;
  if (S.detailId) closeLead();
});

/* ============================ login ============================ */
App.showLogin = function (msg) {
  clearInterval(pollTimer);
  S.me = null; S.detailId = null; document.documentElement.style.overflow = '';
  const lastEmail = lsGet('last_email', '');
  ROOT.innerHTML = `<div class="r-login"><form class="r-login-card" id="r-login" novalidate>
    <div class="r-login-head"><div class="r-logo">BSG</div><h1>بەخێربێیت</h1><p>کۆڵ سەنتەری عەقارات باغی شەقڵاوە</p></div>
    <div class="r-err" id="r-lerr" ${msg ? '' : 'hidden'}>${ic('alert', 18)}<span>${esc(msg || '')}</span></div>
    <div class="r-field"><label class="r-label" for="r-email">ئیمەیڵ</label>
      <input class="r-input ltr" id="r-email" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" required value="${esc(lastEmail)}" placeholder="name@baghyshaqlawa.net"></div>
    <div class="r-field"><label class="r-label" for="r-pw">وشەی نهێنی</label>
      <div class="r-pass"><input class="r-input ltr" id="r-pw" type="password" autocomplete="current-password" autocapitalize="off" required>
      <button type="button" class="r-btn icon ghost" id="r-eye" aria-label="پیشاندانی وشەی نهێنی">${ic('eye', 20)}</button></div></div>
    <button type="submit" class="r-btn primary big" id="r-go">${ic('lock', 20)} چوونەژوورەوە</button>
    <div class="r-login-help">وشەی نهێنیت لەبیرچووە؟ پەیوەندی بە بەڕێوەبەرەوە بکە — وشەیەکی نوێت بۆ دەنێرێت.</div>
  </form></div>`;
  const form = $('#r-login');
  $('#r-eye').addEventListener('click', (e) => {
    const pw = $('#r-pw'); const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    e.currentTarget.innerHTML = ic(show ? 'eyeOff' : 'eye', 20);
    e.currentTarget.setAttribute('aria-label', show ? 'شاردنەوەی وشەی نهێنی' : 'پیشاندانی وشەی نهێنی');
  });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('#r-email').value.trim().toLowerCase(), pw = $('#r-pw').value;
    const err = $('#r-lerr');
    const fail = (t) => { $('span', err).textContent = t; err.hidden = false; };
    if (!email || !pw) { fail('ئیمەیڵ و وشەی نهێنی بنووسە.'); return; }
    err.hidden = true;
    const b = $('#r-go'); busy(b, true);
    try {
      await auth.signIn(email, pw);
      lsSet('last_email', email);
      await loadProfile();
      if (!S.me.realtor_id) {
        await auth.signOut(); S.me = null;
        fail('ئەم ئەپە تەنها بۆ کارمەندانە. بەڕێوەبەر داشبۆردی خۆی هەیە.');
        return;
      }
      startApp();
    } catch (ex) { fail(humanError(ex)); }
    finally { if (b.isConnected) busy(b, false); }
  });
  setTimeout(() => { const f = lastEmail ? $('#r-pw') : $('#r-email'); if (f) f.focus(); }, 50);
};
async function loadProfile() {
  const rows = await rpc('get_my_profile');
  const p = Array.isArray(rows) ? rows[0] : rows;
  if (!p) throw new ApiError('no profile', 'noprofile', 403);
  S.me = { app_user_id: p.app_user_id, role: p.role, realtor_id: p.realtor_id, name: p.name || '', email: p.email || '', branch: p.branch || '' };
  lsSet('me', S.me);
}

/* ============================ boot ============================ */
function startApp() {
  App.renderShell();
  const h = location.hash.replace(/^#\//, '').split('/')[0];
  tab = TITLES[h] ? h : 'inbox';
  if (loadCache()) S.loaded = true;
  App.render(); App.updateBadge();
  ensureGroups().then(() => loadAll(false)).then(() => { if (/^#\/lead\//.test(location.hash)) route(); });
  startPolling();
  Push.start();
}
async function boot() {
  applyTheme();
  window.BSGR = Object.freeze({ version: CFG.version, refresh: () => loadAll(false), open: (id) => openLead(id) });
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !isNativeApp()) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* sw.js not uploaded — the app still works */ });
  }
  if (!auth.s) { App.showLogin(); return; }
  S.me = lsGet('me', null);
  try {
    await loadProfile();
  } catch (e) {
    if (e && e.code === 'network' && S.me && S.me.realtor_id) { S.online = false; startApp(); return; }
    auth.clear();
    App.showLogin(e && e.code === 'session' ? humanError(e) : '');
    return;
  }
  if (!S.me.realtor_id) { await auth.signOut(); App.showLogin('ئەم ئەپە تەنها بۆ کارمەندانە.'); return; }
  startApp();
}
boot();
})();

</script>
</body>
