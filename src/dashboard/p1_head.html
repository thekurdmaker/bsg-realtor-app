<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>بەڕێوەبەری کۆڵ سەنتەر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<script>
  try { var t = localStorage.getItem('bsg_theme'); if (t === '"dark"' || t === '"light"') document.documentElement.setAttribute('data-theme', JSON.parse(t)); } catch (e) {}
</script>
<style>
/* ============ tokens ============ */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --surface-2:#EDF2F1; --surface-3:#E3EAE8;
  --line:#DAE3E1; --line-2:#C7D3D0;
  --ink:#122220; --ink-2:#465855; --ink-3:#778986;
  --accent:#0B7A6E; --accent-strong:#075E55; --accent-soft:#DCF0EC; --accent-ink:#FFFFFF;
  --warn:#9C5B05; --warn-soft:#FCEED6;
  --ok:#1B7A44; --ok-soft:#DCF2E4;
  --bad:#BA3727; --bad-soft:#FBE3DE;
  --ai:#6444BA; --ai-soft:#EDE7FA;
  --mute:#5B6B68; --mute-soft:#E7ECEB;
  --thread-bg:#F6F8F7;
  --bubble-in:#FFF6DC; --bubble-in-line:#F1E3B8;
  --bubble-out:#E1F2EF; --bubble-out-line:#C4E2DC;
  --wa-bg:#EFEAE2; --wa-mine:#D9FDD3; --wa-theirs:#FFFFFF; --wa-ink:#111B21;
  --c-code:#0B7A6E; --c-ad:#2F6FDB; --c-post:#3A9ED3; --c-prefill:#BD8410; --c-ai:#6444BA; --c-other:#A3B0AD;
  --scrim:rgba(8,20,18,.42);
  --shadow:0 1px 2px rgba(18,34,32,.05),0 2px 10px rgba(18,34,32,.05);
  --shadow-lg:0 12px 40px rgba(10,24,22,.20),0 2px 8px rgba(10,24,22,.08);
  --font:"IBM Plex Sans","Noto Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;
  --font-display:"Noto Kufi Arabic","Noto Sans Arabic",Tahoma,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1413; --surface:#131D1C; --surface-2:#1A2725; --surface-3:#22312F;
    --line:#26363A; --line-2:#33474A;
    --ink:#E3EEEC; --ink-2:#A8BAB6; --ink-3:#768A86;
    --accent:#34BFAE; --accent-strong:#62D6C7; --accent-soft:#123833; --accent-ink:#04201C;
    --warn:#E9A94C; --warn-soft:#382810;
    --ok:#52C585; --ok-soft:#0F2F1D;
    --bad:#F07D6B; --bad-soft:#3A1813;
    --ai:#AB90F2; --ai-soft:#251C40;
    --mute:#9AABA7; --mute-soft:#202D2B;
    --thread-bg:#101918;
    --bubble-in:#2A2512; --bubble-in-line:#3B331A;
    --bubble-out:#123632; --bubble-out-line:#1B4842;
    --wa-bg:#0B141A; --wa-mine:#005C4B; --wa-theirs:#202C33; --wa-ink:#E9EDEF;
    --c-code:#34BFAE; --c-ad:#6E9BF0; --c-post:#6CC0EA; --c-prefill:#E2B64A; --c-ai:#AB90F2; --c-other:#5F726F;
    --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
    --shadow-lg:0 12px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1413; --surface:#131D1C; --surface-2:#1A2725; --surface-3:#22312F;
  --line:#26363A; --line-2:#33474A;
  --ink:#E3EEEC; --ink-2:#A8BAB6; --ink-3:#768A86;
  --accent:#34BFAE; --accent-strong:#62D6C7; --accent-soft:#123833; --accent-ink:#04201C;
  --warn:#E9A94C; --warn-soft:#382810;
  --ok:#52C585; --ok-soft:#0F2F1D;
  --bad:#F07D6B; --bad-soft:#3A1813;
  --ai:#AB90F2; --ai-soft:#251C40;
  --mute:#9AABA7; --mute-soft:#202D2B;
  --thread-bg:#101918;
  --bubble-in:#2A2512; --bubble-in-line:#3B331A;
  --bubble-out:#123632; --bubble-out-line:#1B4842;
  --wa-bg:#0B141A; --wa-mine:#005C4B; --wa-theirs:#202C33; --wa-ink:#E9EDEF;
  --c-code:#34BFAE; --c-ad:#6E9BF0; --c-post:#6CC0EA; --c-prefill:#E2B64A; --c-ai:#AB90F2; --c-other:#5F726F;
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
  color-scheme:dark;
}

/* ============ base ============ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-strong)}
[hidden]{display:none !important}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-soft)}
.mono{font-family:var(--font-mono);direction:ltr;unicode-bidi:isolate;font-size:.93em}
.ltr{direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:inline-block;vertical-align:middle}
.flip{transform:scaleX(-1)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slidein{from{transform:translateX(-28px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateY(6px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

/* ============ controls ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:var(--surface-2)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.danger{color:var(--bad);border-color:var(--line-2)}
.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger-solid:hover{filter:brightness(.94)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;gap:5px;border-radius:7px}
.btn.xs{height:26px;padding:0 8px;font-size:12px;gap:4px;border-radius:6px}
.btn.icon{width:36px;padding:0}
.btn.sm.icon{width:30px}
.btn.xs.icon{width:26px}
.btn.wa{color:#128C4A}
:root[data-theme="dark"] .btn.wa{color:#4FD18B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.wa{color:#4FD18B}}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px;justify-content:space-between}
.label .req{color:var(--bad)}
.label .aux{font-weight:500;color:var(--ink-3);font-size:12px}
.input,.select,.textarea{width:100%;height:38px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 12px;transition:border-color .12s,box-shadow .12s}
.textarea{height:auto;min-height:96px;padding:9px 12px;resize:vertical;line-height:1.75}
.select{padding-inline-end:28px}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input:disabled,.textarea:disabled{background:var(--surface-2);color:var(--ink-3)}
.input.ltr,.input.mono{text-align:right}
.input.is-bad,.textarea.is-bad{border-color:var(--bad)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.f2{grid-template-columns:1fr}}
.mail-row{display:flex;gap:6px;align-items:center}
.mail-row .at{color:var(--ink-3);font-weight:600}
.mail-row .input{flex:1 1 0;min-width:0}
.mail-row .select{width:auto;flex:0 1 auto;max-width:62%;padding-inline:8px 24px;font-size:12.5px}
.mail-row .btn{flex:none;height:38px}
.hint{font-size:12px;color:var(--ink-3);line-height:1.55;display:flex;gap:6px;align-items:flex-start}
.hint.ok{color:var(--ok)} .hint.bad{color:var(--bad)} .hint.warn{color:var(--warn)}
.hint .ic{margin-top:2px}
input[type="date"].input{direction:ltr;text-align:right}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:0 11px;height:28px;border-radius:6px;color:var(--ink-2);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}

.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--mute-soft);color:var(--mute);white-space:nowrap;line-height:1}
.chip.pending,.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.answered,.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.escalated,.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.awaiting_ai,.chip.ai{background:var(--ai-soft);color:var(--ai)}
.chip.accent{background:var(--accent-soft);color:var(--accent-strong)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);white-space:nowrap}
.code{font:500 12px var(--font-mono);direction:ltr;unicode-bidi:isolate;background:var(--surface-2);border:1px solid var(--line);padding:1px 7px;border-radius:6px;color:var(--ink);white-space:nowrap}

.switch{all:unset;box-sizing:border-box;cursor:pointer;width:38px;height:22px;border-radius:999px;background:var(--line-2);position:relative;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:inset-inline-start .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{inset-inline-start:19px}
.switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.switch:disabled{opacity:.5;cursor:wait}

.search{position:relative;flex:1 1 220px;min-width:180px;max-width:360px}
.search .ic{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search .input{padding-inline-start:34px}

/* combobox */
.combo{position:relative;min-width:0}
.combo .input{padding-inline-end:34px}
.combo .c-clear{position:absolute;inset-inline-end:5px;top:50%;transform:translateY(-50%)}
.combo-pop{position:absolute;inset-inline:0;top:calc(100% + 4px);z-index:95;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow-lg);max-height:290px;overflow-y:auto;padding:4px;animation:pop .12s ease-out}
.opt{padding:8px 10px;border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px}
.opt[aria-selected="true"]{background:var(--surface-2)}
.opt .os{font-size:12px;color:var(--ink-3);white-space:nowrap}
.opt-empty{padding:10px;color:var(--ink-3);font-size:13px;text-align:center}

/* ============ login ============ */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 26px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);animation:pop .2s ease-out}
.login-card h1{margin:0;font:700 20px/1.5 var(--font-display)}
.login-card p{margin:0;color:var(--ink-3);font-size:13px}
.login-brand{display:flex;align-items:center;gap:12px}

/* ============ shell ============ */
.app{height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-inner{display:flex;align-items:center;gap:18px;padding-block:9px;padding-inline:20px;max-width:1560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 11.5px/1 var(--font);letter-spacing:.06em}
.brand-text{display:flex;flex-direction:column;line-height:1.25}
.brand-text b{font:700 14px/1.4 var(--font-display)}
.brand-text small{font-size:11.5px;color:var(--ink-3)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:8px;color:var(--ink-2);text-decoration:none;white-space:nowrap;font-weight:500;font-size:13.5px}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong)}
.nav-badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font:600 11px/18px var(--font);text-align:center}
.top-actions{margin-inline-start:auto;display:flex;align-items:center;gap:6px;flex:none}
.me-name{font-size:13px;color:var(--ink-2);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{flex:1;min-height:0;overflow:auto}
.page{max-width:1560px;margin:0 auto;padding-block:16px 36px;padding-inline:20px;display:flex;flex-direction:column;gap:14px}
.page.fill{height:100%;padding-block-end:16px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-title{margin:0;font:700 19px/1.45 var(--font-display);text-wrap:balance}
.page-sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.empty{padding:36px 20px;text-align:center;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ic{color:var(--line-2)}
.loading-row{display:flex;align-items:center;justify-content:center;gap:8px;padding:18px;color:var(--ink-3);font-size:13px}

/* ============ leads ============ */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .combo{width:210px}
.date-custom{display:flex;gap:6px;align-items:center}
.date-custom .input{width:150px;height:34px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px 11px;display:flex;flex-direction:column;gap:1px;position:relative;overflow:hidden;transition:border-color .12s,background .12s}
.kpi:hover{border-color:var(--line-2)}
.kpi:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpi[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.kpi .kl{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .kl .dot{width:7px;height:7px;border-radius:50%;background:var(--tone,var(--ink-3))}
.kpi .kn{font:600 25px/1.2 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .ks{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.attn::before{content:"";position:absolute;inset-block-start:0;inset-inline:0;height:3px;background:var(--tone)}
.kpis-mini{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mini{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12.5px;color:var(--ink-2)}
.mini:hover{border-color:var(--line-2)}
.mini b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.mini:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mini[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.mini[aria-pressed="true"] b{color:var(--accent-strong)}

.inbox{flex:1;min-height:480px;display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list-pane{display:flex;flex-direction:column;min-height:0;border-inline-end:1px solid var(--line);position:relative}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-3);min-height:42px}
.list{flex:1;overflow-y:auto;min-height:0}
.lead{all:unset;box-sizing:border-box;display:grid;grid-template-columns:3px minmax(0,1fr);gap:11px;width:100%;padding-block:10px;padding-inline:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.lead:hover{background:var(--surface-2)}
.lead:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.lead[aria-current="true"]{background:var(--accent-soft)}
.lead .stripe{border-radius:3px;background:var(--tone,var(--line))}
.lead-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.lead-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lead-time{font-size:11.5px;color:var(--ink-3);white-space:nowrap;flex:none}
.lead-post{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.lead-post.none{color:var(--ink-3);font-style:normal}
.lead-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px 7px;margin-top:5px;font-size:12px;color:var(--ink-3)}
.lead-meta .who{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.list-more{padding:12px;display:flex;justify-content:center}
.new-pill{position:absolute;top:50px;inset-inline:0;margin-inline:auto;width:max-content;z-index:5;box-shadow:var(--shadow-lg);animation:pop .18s ease-out}

.detail{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface)}
.d-empty{margin:auto;text-align:center;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px;max-width:320px}
.d-empty .ic{color:var(--line-2)}
.d-head{padding-block:12px 12px;padding-inline:18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.d-top{display:flex;align-items:center;gap:8px}
.d-back{display:none}
.d-parties{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center;flex:1;min-width:0}
.party{display:flex;flex-direction:column;gap:1px;min-width:0}
.party .pl{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.03em}
.party .pn{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.party .pnum{display:flex;align-items:center;gap:2px;flex-wrap:wrap;min-width:0}
.party .pnum .mono{font-size:12.5px;color:var(--ink-2);margin-inline-end:4px}
.d-parties .arrow{color:var(--ink-3)}
.d-facts{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.d-facts .fact{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.d-facts .sep{width:1px;height:14px;background:var(--line)}
.post-link{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-width:0;padding:3px 9px 3px 4px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:12.5px}
.post-link span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.post-link:hover{border-color:var(--line-2)}
.note-inline{display:flex;gap:8px;align-items:flex-start;background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:12.5px;white-space:pre-wrap}
.note-inline .ic{color:var(--warn);margin-top:3px}
.d-actions{display:flex;flex-wrap:wrap;gap:6px;padding-block:9px;padding-inline:18px;border-bottom:1px solid var(--line);background:var(--surface-2);align-items:center}
.d-actions .spacer{flex:1}
.d-tabs{display:flex;gap:4px;padding-inline:14px;border-bottom:1px solid var(--line);background:var(--surface)}
.d-tabs button{all:unset;cursor:pointer;padding:10px 8px;font-weight:500;font-size:13.5px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:6px;align-items:center}
.d-tabs button:hover{color:var(--ink)}
.d-tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.d-tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.d-body{flex:1;min-height:0;overflow-y:auto;background:var(--thread-bg)}

.thread{display:flex;flex-direction:column;gap:10px;padding:18px}
.day-sep{align-self:center;font-size:11.5px;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);padding:1px 10px;border-radius:999px;margin-block:4px}
.mw{display:flex;flex-direction:column;gap:3px;max-width:min(80%,580px)}
.mw.in{align-self:flex-start}
.mw.out{align-self:flex-end}
.msg{padding:8px 12px;border-radius:12px;background:var(--bubble-in);border:1px solid var(--bubble-in-line);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75;font-size:13.5px}
.mw.in .msg{border-start-start-radius:4px}
.mw.out .msg{background:var(--bubble-out);border-color:var(--bubble-out-line);border-start-end-radius:4px}
.mw.ai .msg{background:var(--ai-soft);border-color:transparent}
.mw.mgr .msg{background:var(--surface);border-color:var(--accent)}
.msg.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.msg-meta{font-size:11px;color:var(--ink-3);display:flex;gap:6px;align-items:center;padding-inline:4px}
.mw.out .msg-meta{justify-content:flex-end}
.msg-more{all:unset;cursor:pointer;font-size:12px;color:var(--accent-strong);font-weight:600;padding-inline:4px}
.msg img.m-img{display:block;max-width:min(260px,100%);max-height:320px;border-radius:8px;object-fit:cover;cursor:zoom-in;background:var(--surface-2)}
.msg .gallery{display:grid;grid-template-columns:repeat(2,minmax(0,120px));gap:4px}
.msg .gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:zoom-in;background:var(--surface-2)}
.msg video{display:block;max-width:min(300px,100%);border-radius:8px}
.msg audio{display:block;max-width:260px}
.msg .doc{display:inline-flex;gap:6px;align-items:center}
.msg .cap{margin-top:6px}
.composer{border-top:1px solid var(--line);padding-block:10px;padding-inline:14px;display:flex;flex-direction:column;gap:7px;background:var(--surface)}
.c-row{display:flex;gap:8px;align-items:flex-end}
.c-row .textarea{flex:1;min-height:40px;height:40px;max-height:170px;resize:none;padding-block:8px}
.c-note{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.c-note.locked{color:var(--bad)}
.file-chip{display:inline-flex;gap:6px;align-items:center;height:28px;padding-inline:10px 4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;font-size:12.5px;max-width:100%}
.file-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.timeline{list-style:none;margin:0;padding:18px 22px;display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.tl::before{content:"";position:absolute;inset-inline-start:6px;top:16px;bottom:-2px;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl-dot{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);margin-top:4px}
.tl.dash .tl-dot{border-color:var(--ai)}
.tl-label{font-weight:600;font-size:13.5px}
.tl-meta{font-size:12px;color:var(--ink-3)}
.note-pane{padding:18px;display:flex;flex-direction:column;gap:10px;max-width:640px}

/* ============ posts ============ */
.posts{display:flex;flex-direction:column;gap:10px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) auto;gap:12px 22px;align-items:start}
.post.inactive{opacity:.7}
.p-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.p-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.post-title{font-weight:600;font-size:14.5px;line-height:1.65;overflow-wrap:anywhere}
.p-line{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap}
.p-line .ic{color:var(--ink-3)}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
.metric{display:flex;flex-direction:column;min-width:0}
.metric .mv{font:600 16px/1.3 var(--font);font-variant-numeric:tabular-nums;white-space:nowrap}
.metric .mv small{font-size:11.5px;font-weight:500;color:var(--ink-3);margin-inline-start:3px}
.metric .ml{font-size:11.5px;color:var(--ink-3)}
.metric.warn .mv{color:var(--warn)} .metric.bad .mv{color:var(--bad)}
.attr{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--surface-2);margin-top:12px}
.attr span{display:block;height:100%}
.attr-legend{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11.5px;color:var(--ink-3);margin-top:6px}
.attr-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:4px;vertical-align:-1px}
.post-actions{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:112px}

/* ============ tables ============ */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto;min-width:0;contain:paint}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{background:var(--surface-2);text-align:start;font-size:12px;font-weight:600;color:var(--ink-2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t th.sortable{cursor:pointer;user-select:none}
.t th.sortable:hover{color:var(--ink)}
.t th .arr{display:inline-block;width:10px;color:var(--accent)}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:var(--surface-2)}
.t tr.inactive td{color:var(--ink-3)}
.t .c{text-align:center}
.t .who b{display:block;font-weight:600}
.t .who small{color:var(--ink-3);font-size:12px}
.t .hot{color:var(--warn);font-weight:700}
.t .bad{color:var(--bad);font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--surface-3);width:74px;overflow:hidden;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--accent)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}

/* ============ groups / blocked ============ */
.split{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:14px;align-items:start}
.g-list{display:flex;flex-direction:column;overflow:hidden}
.g-list-head{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.g-items{max-height:calc(100vh - 260px);overflow-y:auto}
.g-item{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.g-item:hover{background:var(--surface-2)}
.g-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.g-item[aria-current="true"]{background:var(--accent-soft)}
.g-item .gn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-item .gm{font-size:12px;color:var(--ink-3);white-space:nowrap}
.g-detail{padding:18px;display:flex;flex-direction:column;gap:16px}
.g-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.g-title h2{margin:0;font:700 18px/1.4 var(--font-display)}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.member{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px 9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.member b{display:block;font-weight:600;font-size:13.5px}
.member small{color:var(--ink-3);font-size:12px}
.sub-h{margin:0;font:600 13.5px/1.5 var(--font-display);color:var(--ink-2)}
.add-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.add-row .combo{flex:1 1 240px;max-width:360px}
.blk-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.blk-row:last-child{border-bottom:0}

/* ============ drawer (post editor) ============ */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;animation:fade .15s}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(1120px,100vw);background:var(--bg);z-index:61;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slidein .2s ease-out;padding-top:env(safe-area-inset-top,0px)}
.dr-head{display:flex;align-items:center;gap:12px;padding-block:12px;padding-inline:20px;background:var(--surface);border-bottom:1px solid var(--line)}
.dr-head h2{margin:0;font:700 17px/1.4 var(--font-display)}
.dr-head .sub{color:var(--ink-3);font-size:12.5px}
.dr-head .close{margin-inline-start:auto}
.dr-body{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;padding-block:16px 24px;padding-inline:20px;align-items:start}
.dr-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-inline:20px;background:var(--surface);border-top:1px solid var(--line)}
.dr-foot .kbd{margin-inline-start:auto;font-size:12px;color:var(--ink-3)}
kbd{font:500 11px var(--font-mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface-2)}
.pe-form{display:flex;flex-direction:column;gap:14px;min-width:0}
.pe-sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pe-sec h3{margin:0;font:600 14px/1.5 var(--font-display);display:flex;align-items:center;gap:9px}
.pe-sec h3 .n{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;font:600 12px/1 var(--font);flex:none}
.pe-sec h3 .aux{margin-inline-start:auto;font:500 12px var(--font);color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.quick{display:flex;flex-wrap:wrap;gap:4px}
.quick button{all:unset;cursor:pointer;height:22px;padding:0 8px;border-radius:6px;border:1px solid var(--line);font-size:12px;color:var(--ink-2);background:var(--surface)}
.quick button:hover{border-color:var(--accent);color:var(--accent-strong)}
.quick button:focus-visible{outline:2px solid var(--accent)}
.ids{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end}
.ids .swap{margin-bottom:1px}
.pe-side{position:sticky;top:0;display:flex;flex-direction:column;gap:14px;min-width:0}
.side-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.side-card h4{margin:0;font:600 13px/1.5 var(--font-display);color:var(--ink-2)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.check{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:12.5px;align-items:start;line-height:1.55}
.check .ci{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--ink-3);margin-top:1px}
.check.ok .ci{background:var(--ok)} .check.bad .ci{background:var(--bad)} .check.warn .ci{background:var(--warn)}
.check b{font-weight:600;color:var(--ink)}
.check span{color:var(--ink-2)}
.wa-chat{background:var(--wa-bg);border-radius:10px;padding:12px 10px;display:flex;flex-direction:column;gap:8px;max-height:460px;overflow-y:auto}
.wa-chat .b{max-width:94%;padding:7px 10px;border-radius:9px;font-size:12.5px;white-space:pre-wrap;line-height:1.7;color:var(--wa-ink);box-shadow:0 1px .5px rgba(0,0,0,.13);overflow-wrap:anywhere}
.wa-chat .b.mine{align-self:flex-end;background:var(--wa-mine)}
.wa-chat .b.theirs{align-self:flex-start;background:var(--wa-theirs)}
.wa-chat .who{font-size:11px;font-weight:600;opacity:.65;margin-bottom:2px}
.wa-chat .cta{align-self:flex-start;background:var(--wa-theirs);color:#1DA0E0;border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600;box-shadow:0 1px .5px rgba(0,0,0,.13)}
.counter{font:500 11.5px var(--font-mono);color:var(--ink-3)}
.counter.over{color:var(--bad)}
.members-pick{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.members-pick label{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.members-pick label:last-child{border-bottom:0}
.members-pick label:hover{background:var(--surface-2)}
.members-pick input{accent-color:var(--accent);width:16px;height:16px}
.members-pick small{color:var(--ink-3);margin-inline-start:auto;font-size:12px}

.fb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:360px;overflow-y:auto;padding:2px}
.fb-card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);min-width:0}
.fb-card:hover{border-color:var(--accent)}
.fb-card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fb-card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.fb-card[data-in="1"]{opacity:.62}
.fb-card img,.fb-noimg{width:100%;aspect-ratio:16/10;object-fit:cover;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-3)}
.fb-meta{display:flex;flex-direction:column;gap:4px;padding:8px;min-width:0}
.fb-t{font-size:12.5px;line-height:1.55;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.token-warn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:12.5px;font-weight:600;white-space:nowrap}
/* ============ ads ============ */
.kpi.static{cursor:default}
.kpi.static:hover{border-color:var(--line)}
.seg-n{unicode-bidi:isolate;display:inline-block;margin-inline-start:6px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.seg-n:empty{display:none}
.recs-card{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.recs-head{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.recs-head h2{margin:0;font:700 15px/1.5 var(--font-display);display:flex;align-items:center;gap:8px}
.recs-head h2 .ic{color:var(--accent)}
.recs-sum{display:flex;gap:6px;flex-wrap:wrap}
.recs-bench{margin-inline-start:auto;font-size:12px}
.recs{display:flex;flex-direction:column;gap:8px}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2);border-inline-start:3px solid var(--line-2)}
.rec.bad{border-color:var(--bad);background:var(--bad-soft)}
.rec.warn{border-color:var(--warn);background:var(--warn-soft)}
.rec.good{border-color:var(--ok);background:var(--ok-soft)}
.rec-ic{display:grid;place-items:center;color:var(--ink-3);align-self:start;margin-top:2px}
.rec.bad .rec-ic{color:var(--bad)} .rec.warn .rec-ic{color:var(--warn)} .rec.good .rec-ic{color:var(--ok)}
.rec-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.rec-h{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px}
.rec-h b{white-space:nowrap}
.rec-h .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rec-thumb{width:26px;height:26px;border-radius:6px;object-fit:cover;flex:none}
.rec-t{font-size:13px;line-height:1.7;color:var(--ink)}
.rec-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rec-acts:empty{display:none}
.rec.slim{padding:6px 10px;background:transparent}
.rec.slim.bad{background:var(--bad-soft)} .rec.slim.warn{background:var(--warn-soft)} .rec.slim.good{background:var(--ok-soft)}
.rec.slim .rec-t{font-size:12.5px}
.ads{display:flex;flex-direction:column;gap:10px}
.ad{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:88px minmax(0,1.15fr) minmax(0,1fr) auto;gap:12px 18px;align-items:start}
.ad-img{width:88px;height:88px;border-radius:10px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-3);border:1px solid var(--line)}
.ad-img img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.ad.off .ad-img img{filter:grayscale(.55);opacity:.85}
.ad-recs{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.metric.good .mv{color:var(--ok)}
.p-hero{display:flex;gap:12px;align-items:flex-start;min-width:0}
.p-hero-t{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.p-thumb{width:72px;height:72px;border-radius:9px;object-fit:cover;flex:none;border:1px solid var(--line);background:var(--surface-2);cursor:zoom-in;display:block}
.p-thumb.none{display:grid;place-items:center;color:var(--line-2);cursor:default}
.gp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.gp{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.gp:hover{border-color:var(--accent)}
.gp:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.gp.inactive{opacity:.65}
.gp img,.gp .gp-noimg{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;color:var(--line-2)}
.gp-b{display:flex;flex-direction:column;gap:3px;min-width:0}
.gp-top{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.gp-t{font-size:12.5px;line-height:1.55;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gp-m{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-bit{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pl-bit .ic{color:var(--ink-3)}
.ad .p-line{gap:4px 14px}
.g-list-head .search{flex:none;max-width:none}
/* ============ reports ============ */
.rp-charts{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px}
.chart-card{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chart-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chart-h h3{margin:0;font:600 13.5px/1.5 var(--font-display);color:var(--ink-2)}
.chart-key{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3)}
.chart-key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-start:6px}
.chart-key .k-in{background:var(--accent)} .chart-key .k-out{background:var(--line-2)}
.hbars{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:2px;height:150px;align-items:end;border-bottom:1px solid var(--line)}
.hbar{all:unset;box-sizing:border-box;height:100%;display:flex;align-items:flex-end;cursor:default;border-radius:4px 4px 0 0}
.hbar:hover,.hbar:focus-visible{background:var(--surface-2)}
.hbar:focus-visible{outline:2px solid var(--accent)}
.hbar i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:0}
.hbar.off i{background:var(--line-2)}
.hbar-axis{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:2px;font:500 11px var(--font-mono);color:var(--ink-3)}
.hbar-axis span{text-align:center}
.dbars{display:flex;flex-direction:column;gap:4px}
.dbar{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:3px 6px;border-radius:6px;font-size:12.5px}
.dbar:not(.static):hover,.dbar:focus-visible{background:var(--surface-2)}
.dbar:focus-visible{outline:2px solid var(--accent)}
.dbar .dl{width:78px;color:var(--ink-2)}
.dbar .dt{height:10px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.dbar .dt i{display:block;height:100%;background:var(--accent);border-radius:4px}
.dbar .dv{font-weight:600;min-width:34px;text-align:end}
.dbar .dm{font-size:11.5px;color:var(--ink-3);min-width:74px;text-align:end;white-space:nowrap}
.dbar .dm.bad{color:var(--bad)}
.rp-tip{position:fixed;z-index:130;background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 10px;font-size:12px;display:flex;flex-direction:column;gap:1px;pointer-events:none;box-shadow:var(--shadow-lg);max-width:240px}
.rp-tip b{font-weight:600}
.rp-t td.who{white-space:nowrap}
.rp-t tfoot td{background:var(--surface-2);font-weight:600;border-top:1px solid var(--line)}
.rp-t tr.clickable{cursor:pointer}
.rp-t tr.clickable:focus-visible td{outline:2px solid var(--accent);outline-offset:-2px}
.tag.warn-tag{color:var(--warn);border-color:var(--warn-soft);background:var(--warn-soft)}
.idle-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
.idle-card{display:flex;flex-direction:column;overflow:hidden}
.idle-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.idle-h h3{margin:0;font:600 14px/1.5 var(--font-display);display:flex;gap:8px;align-items:center}
.idle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.idle-row:last-child{border-bottom:0}
.idle-who{display:flex;flex-direction:column;min-width:0}
.idle-who b{font-weight:600}
.idle-who .tag{align-self:flex-start;margin-block:2px}
.idle-who small{color:var(--ink-3);font-size:12px}
/* ============ new post page ============ */
.pe-steps{display:flex;gap:6px;margin:0;padding:0;list-style:none;flex-wrap:wrap}
.pe-steps li{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3);font-size:12.5px;font-weight:600;background:var(--surface)}
.pe-steps li.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
.pe-pick{display:flex;flex-direction:column;gap:10px}
.fb-tools .search{max-width:320px}
.fb-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);min-height:20px}
.fbp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fbp{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:border-color .12s}
.fbp:hover{border-color:var(--line-2)}
.fbp.in{background:var(--surface-2)}
.fbp-img{all:unset;box-sizing:border-box;cursor:pointer;display:block;position:relative;aspect-ratio:4/3;background:var(--surface-2);overflow:hidden}
.fbp-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.fbp-img:hover img{transform:scale(1.03)}
.fbp-img .fb-noimg{aspect-ratio:auto;height:100%}
.fbp-img:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.fbp.in .fbp-img img{filter:saturate(.55);opacity:.8}
.fbp-badge{position:absolute;top:8px;inset-inline-start:8px;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:rgba(0,0,0,.62);color:#fff;font-size:11.5px;font-weight:600}
.fbp-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.fbp-t{font-weight:600;font-size:13.5px;line-height:1.6;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.fbp-s{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbp-r{display:flex;flex-wrap:wrap;gap:4px}
.rchip{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:2px 8px;border-radius:7px;font-size:12px;font-weight:500;background:var(--mute-soft);color:var(--mute);flex-wrap:wrap;line-height:1.5}
.rchip.ok{background:var(--ok-soft);color:var(--ok)} .rchip.warn{background:var(--warn-soft);color:var(--warn)} .rchip.bad{background:var(--bad-soft);color:var(--bad)}
.rchip-btn{all:unset;cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:2px}
.rchip-btn:focus-visible{outline:2px solid currentColor;border-radius:3px}
.fbp-foot{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:4px;font-size:12px;flex-wrap:wrap}
.fbp.hid{opacity:.72}.fbp.hid .fbp-img img{filter:grayscale(.6)}
.btn.call{background:color-mix(in srgb,var(--ok) 14%,transparent);border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok)}
.btn.call.primary{background:var(--ok);border-color:var(--ok);color:#fff}
.fbp.sk .fbp-img{cursor:default;animation:pulse 1.2s ease-in-out infinite}
.sk-l{display:block;height:12px;border-radius:6px;background:var(--surface-2);animation:pulse 1.2s ease-in-out infinite}
.sk-l.s{width:60%}
@keyframes pulse{50%{opacity:.5}}
.pe-grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;align-items:start;margin-top:12px}
.pe-page .pe-side{top:12px}
.pe-foot{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg)}
.pe-foot .kbd{margin-inline-start:auto;font-size:12px;color:var(--ink-3)}
.picked{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--accent);border-radius:12px;box-shadow:0 0 0 3px var(--accent-soft)}
.picked img,.picked .fb-noimg{width:76px;height:76px;border-radius:9px;object-fit:cover;flex:none;aspect-ratio:auto}
.picked img{cursor:zoom-in}
.picked-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.picked-acts{display:flex;gap:6px;flex-wrap:wrap}
.picked.manual{border-style:dashed;border-color:var(--line-2);box-shadow:none;color:var(--ink-2)}
/* ============ system health ============ */
.btn.health{position:relative}
.btn.health .hdot{position:absolute;top:5px;inset-inline-end:5px;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--surface)}
.btn.health.bad .hdot{background:var(--bad)} .btn.health.warn .hdot{background:var(--warn)}
.btn.health.bad{color:var(--bad)} .btn.health.warn{color:var(--warn)}
.hl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hl li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;padding:9px 11px;border-radius:9px;background:var(--surface-2)}
.hl li.bad{background:var(--bad-soft)} .hl li.warn{background:var(--warn-soft)}
.hl .hi{margin-top:1px;color:var(--ok)} .hl li.bad .hi{color:var(--bad)} .hl li.warn .hi{color:var(--warn)}
.hl b{display:block;font-size:13px}
.hl span{font-size:12.5px;color:var(--ink-2)}
/* ============ modal / toast / lightbox ============ */
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px}
.modal .m-scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .15s}
.m-card{position:relative;background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:min(480px,100%);display:flex;flex-direction:column;animation:pop .16s ease-out;max-height:calc(100vh - 32px)}
.m-card.wide{width:min(620px,100%)}
.m-head{padding:16px 18px 4px;font:700 16px/1.5 var(--font-display)}
.m-body{padding:8px 18px 6px;display:flex;flex-direction:column;gap:12px;color:var(--ink-2);min-height:0}
.m-body p{margin:0;line-height:1.75}
.m-err{padding:0 18px}
.m-foot{display:flex;gap:8px;padding:12px 18px 16px;flex-wrap:wrap}
.toasts{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:120;pointer-events:none;padding-inline:16px}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow-lg);font-weight:500;font-size:13.5px;max-width:min(560px,100%);display:flex;gap:9px;align-items:center;animation:pop .18s ease-out}
.toast.err{background:var(--bad);color:#fff}
.lightbox{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.86);display:grid;place-items:center;padding:24px;cursor:zoom-out;animation:fade .15s}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.menu-pop{position:absolute;z-index:96;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow-lg);padding:4px;min-width:190px;animation:pop .12s ease-out}
.menu-pop button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13.5px}
.menu-pop button:hover,.menu-pop button:focus-visible{background:var(--surface-2)}
.menu-pop button.danger{color:var(--bad)}
.menu-pop button:disabled{opacity:.45;cursor:not-allowed}

/* ============ responsive ============ */
@media (max-width:1240px){
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .post{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .post-actions{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;min-width:0}
  .ad{grid-template-columns:76px minmax(0,1fr) minmax(0,1fr)}
  .ad-img{width:76px;height:76px}
  .dr-body{grid-template-columns:minmax(0,1fr)}
  .rp-charts{grid-template-columns:minmax(0,1fr)}
  .pe-grid{grid-template-columns:minmax(0,1fr)}
  .pe-side{position:static;order:-1}
  .wa-chat{max-height:300px}
}
@media (max-width:920px){
  .page.fill{height:auto}
  .inbox{grid-template-columns:minmax(0,1fr);flex:none;min-height:0}
  .list-pane{border-inline-end:0}
  .list{overflow:visible}
  .inbox:not(.has-sel) .detail{display:none}
  .inbox.has-sel .detail{position:fixed;inset:0;z-index:40;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .d-back{display:inline-flex}
  .split{grid-template-columns:minmax(0,1fr)}
  .g-items{max-height:none}
  .brand-text small{display:none}
}
@media (max-width:760px){
  .topbar-inner{flex-wrap:wrap;gap:8px;padding-inline:16px}
  .nav{order:3;width:100%;margin-inline:-4px}
  .page{padding-inline:16px}
  .hide-sm{display:none !important}
  .post{grid-template-columns:minmax(0,1fr)}
  .ad{grid-template-columns:64px minmax(0,1fr);padding:12px}
  .idle-grid{grid-template-columns:minmax(0,1fr)}
  .picked{flex-wrap:wrap}
  .picked-acts{width:100%}
  .pe-foot .kbd{display:none}
  .pe-foot{padding-inline:12px}
  .fb-tools .search{max-width:none}
  .hbars{height:110px}
  .dbar .dm{min-width:0}
  .dbar .dl{width:64px}
  .ad-img{width:64px;height:64px}
  .ad .p-stats{grid-column:1/-1}
  .rec{grid-template-columns:auto minmax(0,1fr)}
  .rec-acts{grid-column:2;justify-content:flex-start}
  .recs-bench{margin-inline-start:0;width:100%}
  .p-thumb{width:60px;height:60px}
  .grid2,.grid4{grid-template-columns:minmax(0,1fr)}
  .grid4.keep{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters .combo,.search{width:100%;max-width:none;flex:1 1 100%}
  .d-parties{grid-template-columns:minmax(0,1fr);gap:6px}
  .d-parties .arrow{display:none}
  .dr-body,.dr-head,.dr-foot{padding-inline:16px}
  .ids{grid-template-columns:minmax(0,1fr)}
  .ids .swap{justify-self:start}
  .dr-foot .kbd{display:none}
  .me-name{display:none}
  .page-sub{display:none}
  .seg{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi .ks{display:none}
  .kpi .kn{font-size:22px}
}

/* ---- settings page ---- */
.st-sec{padding:18px;margin-bottom:14px}
.st-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;color:var(--accent-strong)}
.st-head h2{margin:0;font:700 16px/1.4 var(--font-display);color:var(--ink)}
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.st-grid .field:has(textarea),.st-grid .st-row,.st-grid .field:has(.st-days){grid-column:1 / -1}
@media(max-width:700px){.st-grid{grid-template-columns:1fr}}
.st-row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.st-row.master{background:var(--accent-soft);border-color:transparent}
.st-row .st-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.st-row .st-t b{font-weight:600;font-size:14px}
.st-days{display:flex;flex-wrap:wrap;gap:6px}
.st-days button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;height:32px;padding:0 12px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.st-days button[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600}
.st-tokens{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.st-tokens .chip{cursor:pointer;border:0;direction:ltr;unicode-bidi:isolate;font-family:var(--font-mono)}
.st-foot{display:flex;justify-content:flex-end;margin-top:16px}
.st-extra{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line-2);display:flex;flex-direction:column;gap:12px}
.st-test{display:flex;flex-direction:column;gap:6px}
.st-test-row{display:flex;gap:8px;flex-wrap:wrap}
.st-test-row .select{flex:1 1 220px;width:auto}
.st-test-row .input{flex:2 1 240px}
.st-log{display:flex;flex-direction:column;gap:6px}
.st-logt td{font-size:12.5px;padding:6px 8px}
.st-kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.st-kv div{display:flex;flex-direction:column;gap:2px;background:var(--surface-2);border-radius:10px;padding:8px 10px}
.st-kv span{font-size:12px;color:var(--ink-3)}
.st-kv b{font-size:13.5px}
.st-kv b.bad{color:var(--bad)}

.st-tabs{margin-bottom:14px}
.st-tabs button{height:34px;padding:0 14px;display:inline-flex;align-items:center;gap:6px}
.st-tabbody .page{padding:0;max-width:none}
.st-tabbody .page .page-head{display:none}
.st-note{display:flex;gap:8px;align-items:flex-start;padding:12px 14px;margin-bottom:14px;color:var(--ink-2);font-size:13px;line-height:1.7}
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="login-brand">
      <span class="brand-mark">BSG</span>
      <div><h1>بەڕێوەبەری کۆڵ سەنتەر</h1><p>عەقاراتی باغی شەقڵاوە</p></div>
    </div>
    <div class="field">
      <label class="label" for="login-email">ئیمەیڵ</label>
      <input class="input ltr" id="login-email" type="email" autocomplete="username" required dir="ltr">
    </div>
    <div class="field">
      <label class="label" for="login-pass">وشەی نهێنی</label>
      <input class="input ltr" id="login-pass" type="password" autocomplete="current-password" required dir="ltr">
    </div>
    <div class="hint bad" id="login-err" hidden></div>
    <button class="btn primary" id="login-btn" type="submit">چوونەژوورەوە</button>
  </form>
</div>

<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/leads" style="text-decoration:none;color:inherit">
        <span class="brand-mark">BSG</span>
        <span class="brand-text"><b>کۆڵ سەنتەر</b><small>پانێڵی بەڕێوەبەر</small></span>
      </a>
      <nav class="nav" id="nav" aria-label="بەشەکان"></nav>
      <div class="top-actions">
        <button class="btn primary" id="btn-new-post" type="button"></button>
        <button class="btn ghost icon health" id="btn-health" type="button" aria-label="دۆخی سیستەم" title="دۆخی سیستەم" hidden></button>
        <button class="btn ghost icon" id="btn-theme" type="button" aria-label="گۆڕینی ڕووکار" title="گۆڕینی ڕووکار"></button>
        <span class="me-name" id="me-name"></span>
        <button class="btn ghost icon" id="btn-logout" type="button" aria-label="چوونەدەرەوە" title="چوونەدەرەوە"></button>
      </div>
    </div>
  </header>
  <main class="main" id="main"><div id="view"></div></main>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
