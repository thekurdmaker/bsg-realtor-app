<!doctype html>
<html lang="ckb" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BSG</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f5f4;color:#15201c;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box;text-align:center}
  @media (prefers-color-scheme:dark){body{background:#0f1513;color:#e7eeeb}}
  .logo{width:72px;height:72px;border-radius:20px;background:#0f7a5c;color:#fff;font-weight:800;display:grid;place-items:center;margin:0 auto 18px;font-size:20px;letter-spacing:.5px}
  h1{font-size:20px;margin:0 0 8px}
  p{margin:0 0 22px;opacity:.75;line-height:1.7}
  button{font:inherit;font-weight:700;font-size:17px;border:0;border-radius:14px;padding:14px 28px;background:#0f7a5c;color:#fff}
</style></head>
<body><div>
  <div class="logo">BSG</div>
  <h1>ئینتەرنێت نییە</h1>
  <p>ئەپەکە پێویستی بە ئینتەرنێتە.<br>پەیوەندییەکەت بپشکنە و دووبارە هەوڵ بدەرەوە.</p>
  <button type="button" onclick="location.href='__APP_URL__'">دووبارە هەوڵدانەوە</button>
</div></body></html>
